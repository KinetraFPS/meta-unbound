<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overwatch Meta Auditor</title>
<meta name="description" content="Overwatch hero tiers by role, rank, region and map, with patch notes read into buffs and nerfs.">
<link rel="stylesheet" href="style.css?v=78aa19d5fa">
<link rel="stylesheet" href="ow.css?v=caee0d2e8f">
<script>/* Dark by default; the header toggle saves light/dark per browser. */ let t = 'dark'; try { t = localStorage.getItem('dma-theme') || 'dark'; } catch {} document.documentElement.dataset.theme = t;</script>
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="brand" href="#/meta" aria-label="Overwatch Meta Auditor home">
      <span class="logo ow" aria-hidden="true">◎</span>
      <span><b>Overwatch Meta</b><small id="patch-chip"></small></span>
    </a>
    <div class="game-switch" role="navigation" aria-label="Game"><a href="../">Deadlock</a><a class="on" href="./" aria-current="page">Overwatch</a></div>
    <div class="search">
      <input id="hero-search" type="search" placeholder="Search heroes…  ( / )" autocomplete="off" aria-label="Search heroes" role="combobox" aria-expanded="false" aria-controls="search-list">
      <ul id="search-list" role="listbox" hidden></ul>
    </div>
    <label class="ctx-pick"><span>Platform</span><select id="sel-platform" aria-label="Platform"></select></label>
    <label class="ctx-pick"><span>Region</span><select id="sel-region" aria-label="Region"></select></label>
    <label class="ctx-pick"><span>Rank</span><select id="sel-div" aria-label="Rank"></select></label>
    <button id="theme-btn" class="icon-btn" aria-label="Toggle light/dark theme" title="Toggle theme">◐</button>
  </div>
  <nav id="tabs" aria-label="Sections">
    <a href="#/meta" data-route="meta">Meta</a>
    <a href="#/maps" data-route="maps">Maps</a>
    <a href="#/patch" data-route="patch">Patch impact</a>
    <a href="#/about" data-route="about">Data &amp; audit</a>
  </nav>
</header>

<main id="view" tabindex="-1"></main>

<footer class="foot">
  <span id="foot-info"></span>
  <span>Fan-made, not affiliated with Blizzard · stats: Blizzard Hero Statistics via <a href="https://overfast-api.tekrop.fr" target="_blank" rel="noopener">OverFast API</a> · patch notes: <a href="https://overwatch.blizzard.com/en-us/news/patch-notes/" target="_blank" rel="noopener">Blizzard</a></span>
</footer>

<div id="tip" role="tooltip"></div>
<script src="data.js?v=6b7d821fe7"></script>
<script src="app.js?v=ee07102eaa"></script>
</body>
</html>
