<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deadlock Meta Auditor</title>
<meta name="description" content="Patch-aware Deadlock hero tiers, meta builds, matchups, synergies and draft helper.">
<link rel="stylesheet" href="style.css?v=78aa19d5fa">
<script>/* Dark by default; the header toggle saves light/dark per browser. */ let t = 'dark'; try { t = localStorage.getItem('dma-theme') || 'dark'; } catch {} document.documentElement.dataset.theme = t;</script>
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="brand" href="#/meta" aria-label="Deadlock Meta Auditor home">
      <span class="logo" aria-hidden="true">◆</span>
      <span><b>Deadlock Meta</b><small id="patch-chip"></small></span>
    </a>
    <div class="game-switch" role="navigation" aria-label="Game"><a class="on" href="./" aria-current="page">Deadlock</a><a href="overwatch/">Overwatch</a></div>
    <div class="search">
      <input id="hero-search" type="search" placeholder="Search heroes…  ( / )" autocomplete="off" aria-label="Search heroes" role="combobox" aria-expanded="false" aria-controls="search-list">
      <ul id="search-list" role="listbox" hidden></ul>
    </div>
    <label class="ctx-pick"><span>Situation</span>
      <select id="ctx-select" aria-label="Situation"></select>
    </label>
    <button id="theme-btn" class="icon-btn" aria-label="Toggle light/dark theme" title="Toggle theme">◐</button>
  </div>
  <nav id="tabs" aria-label="Sections">
    <a href="#/meta" data-route="meta">Meta</a>
    <a href="#/patch" data-route="patch">Patch impact</a>
    <a href="#/matchups" data-route="matchups">Matchups</a>
    <a href="#/draft" data-route="draft">Draft helper</a>
    <a href="#/audit" data-route="audit">Audit</a>
  </nav>
</header>

<main id="view" tabindex="-1"></main>

<footer class="foot">
  <span id="foot-info"></span>
  <span>Fan-made, not affiliated with Valve · data: <a href="https://deadlock-api.com" target="_blank" rel="noopener">deadlock-api.com</a></span>
</footer>

<div id="tip" role="tooltip"></div>
<script src="data.js?v=0f97485cd2"></script>
<script src="app.js?v=33196b24ac"></script>
</body>
</html>
